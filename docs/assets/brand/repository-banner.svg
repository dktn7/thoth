<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">THOTH — Create. Connect. Explore.</title>
<desc id="desc">Repository banner using the approved navy and forest colour references. Plain editorial lettering, not a replacement wordmark.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.8"><stop stop-color="#101D33"/><stop offset=".56" stop-color="#101D33"/><stop offset="1" stop-color="#123D32"/></linearGradient></defs>
<rect width="1200" height="300" rx="16" fill="url(#bg)"/>
<path d="M80 55H1120" stroke="#DDECE6" stroke-opacity=".24"/>
<text x="80" y="100" fill="#DDECE6" font-family="Arial, sans-serif" font-size="17" letter-spacing="6">THOTH</text>
<text x="80" y="174" fill="#F5F6F2" font-family="Georgia, serif" font-size="57" font-weight="400">Create. Connect. Explore.</text>
<text x="82" y="220" fill="#DDECE6" font-family="Arial, sans-serif" font-size="21">A new way to create, think and write.</text>
<path d="M80 253H1120" stroke="#DDECE6" stroke-opacity=".24"/>
<text x="82" y="277" fill="#DDECE6" font-family="Arial, sans-serif" font-size="12" letter-spacing="2">AUTHORING   /   DESIGN   /   CONNECTED KNOWLEDGE</text>
</svg>
