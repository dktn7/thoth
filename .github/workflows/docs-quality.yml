name: Documentation quality

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.markdownlint.json'
      - '.lycheeignore'
      - 'tools/check_docs.py'
      - '.github/workflows/docs-quality.yml'
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-docs:
    name: Local links and Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check local file, image and heading links
        run: python3 tools/check_docs.py
      - name: Test documentation link checker
        run: python3 -m unittest discover -s tools -p 'test_check_docs.py'
      - name: Check Markdown formatting
        run: npx --yes markdownlint-cli2@0.24.2 '**/*.md'

  external-links:
    name: Public HTTP links
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check links at a modest rate
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: >-
            --no-progress --max-concurrency 4 --timeout 15
            --max-retries 2 './**/*.md'
          fail: true
